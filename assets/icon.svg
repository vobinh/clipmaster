<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="clipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Clipboard Board -->
  <rect x="28" y="30" width="72" height="78" rx="10" fill="url(#clipGrad)" filter="url(#shadow)"/>

  <!-- Clipboard Top Clip -->
  <rect x="46" y="22" width="36" height="16" rx="6" fill="#0f172a"/>
  <rect x="52" y="16" width="24" height="12" rx="4" fill="#38bdf8"/>
  <circle cx="64" cy="22" r="3" fill="#ffffff"/>

  <!-- Content Lines on Paper -->
  <rect x="38" y="48" width="34" height="6" rx="3" fill="url(#accentGrad)"/>
  <rect x="38" y="60" width="52" height="5" rx="2.5" fill="#94a3b8"/>
  <rect x="38" y="70" width="44" height="5" rx="2.5" fill="#cbd5e1"/>
  <rect x="38" y="80" width="30" height="5" rx="2.5" fill="#cbd5e1"/>

  <!-- Small V badge at bottom right -->
  <circle cx="88" cy="92" r="16" fill="#10b981" filter="url(#shadow)"/>
  <path d="M81 92 L86 97 L95 87" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
